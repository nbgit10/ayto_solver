/* ─── tokens — neon brand source (see brand-spec.md) ─────────────────── */
:root {
  --bg:        #0c0a12;
  --surface:   #15111d;

  --her:    #ff6fae;

  --container: 1180px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

*, *::before, *::after { box-sizing: border-box; }

  margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;

.live { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px;

.gauge-card { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr;

.night .num { width: 38px; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--muted); transition: color 0.2s; }
.night[open] .num { color: var(--accent-hi); }
.night .nlabel { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-2); }
.night .mcount { display: flex; align-items: center; gap: 10px; }
.pips { display: flex; gap: 4px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--border-2); }
.pips i.on { background: var(--accent); box-shadow: 0 0 10px -2px var(--accent); }
.night .mcount b { font-family: var(--font-mono); font-size: 14px; color: var(--accent-hi); }
.night .mcount small { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.night-body { padding: 16px 20px 20px; }
.night-pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 28px; margin-top: 12px; }
.npair { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px;
  border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent); }
.note { margin-top: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.note.danger { color: var(--danger); }

/* footer */
.pagefoot { margin-top: clamp(52px, 8vw, 100px); border-top: 1px solid var(--border); }
.foot-in { display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end; padding-block: 40px; }
.foot-brand { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; }
.foot-brand span { color: var(--accent-hi); }
.foot-ramp { display: flex; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--border); }
.foot-ramp .ramp { height: 8px; flex: 1; border-radius: 999px;
  background: linear-gradient(90deg, var(--heat-0), var(--heat-1), var(--heat-2), var(--heat-3), var(--heat-4)); }

@media (max-width: 900px) {
  .cards, .matches, .confirmed { grid-template-columns: repeat(2, 1fr); }
  .feature-grid { grid-template-columns: 1fr; align-items: start; }
}
@media (max-width: 760px) {
  .gauge-card { grid-template-columns: 1fr; }
  .navlink { display: none; }
}
@media (max-width: 620px) {
  .cards, .matches, .confirmed, .night-pairs { grid-template-columns: 1fr; }
  .mini-stats { grid-template-columns: 1fr 1fr; }
}

    return { label: fmt(s.sol) + " Möglichkeiten", color: "var(--accent-hi)", cert: Math.max(0.06, 1 / Math.sqrt(s.sol)) };
  }

  /* ── overview ─────────────────────────────────────────────────────── */
  function seasonCard(s, i) {
    var st = statusOf(s);
    return '<a class="scard" data-od-id="season-card-' + s.id + '" href="#/staffel/' + s.id + '">' +
      '<div class="top"><span class="idx">' + String(i + 1).padStart(2, "0") + "</span>" + (s.type === "vip" ? '<span class="pill gold">VIP</span>' : "") + "</div>" +
      "<h3>" + esc(s.name) + "</h3>" +
      '<p class="sub">' + s.year + " · Folge " + s.ep + " von " + s.totalEp + "</p>" +
      '<div class="heatbar"><i data-bar="' + Math.round(st.cert * 100) + '" style="width:0%;background:linear-gradient(90deg,var(--heat-1),' + st.color + ')"></i></div>' +
      '<div class="foot"><span style="color:' + st.color + '">' + st.label + "</span>" + (s.conf > 0 ? "<span>" + s.conf + " Fix</span>" : "") + "</div>" +
    "</a>";
  }

  function renderOverview() {
    var seasons = D.seasons;
    var cur = seasons.filter(function (s) { return s.current; })[0] || seasons[0];
    var archive = seasons.filter(function (s) { return s.id !== cur.id; });
    var solved = seasons.filter(function (s) { return s.sol === 1 && !s.infeasible; }).length;
    var parts = cur.nm + cur.nf;
    document.title = "AYTO Matches — Wer ist wirklich ein Perfect Match?";
    root.innerHTML =
      '<section class="hero wrap" data-od-id="hero">' +
        '<p class="kicker">Are You The One? Deutschland · Zahlen statt Bauchgefühl</p>' +
        '<h1>Wer ist wirklich ein <span class="grad">Perfect Match</span><span class="qm">?</span></h1>' +
        '<p class="lead">Jede Matching Night und jede Matchbox zählt. Wir zeigen dir, welche Paare laut Daten die besten Chancen haben — und wie sicher der Solver schon ist.</p>' +
        '<div class="kpis">' +
          '<span class="kpi"><b style="color:var(--him)">' + seasons.length + '</b> Staffeln</span>' +
          '<span class="kpi"><b style="color:var(--accent-hi)">' + solved + '</b> komplett gelöst</span>' +
          '<span class="kpi"><b style="color:var(--her)">100%</b> Zahlen</span>' +
        "</div>" +
      "</section>" +
      '<section class="wrap" data-od-id="current-season">' +
        '<a class="feature card" href="#/staffel/' + cur.id + '">' +
          '<div class="feature-glow"></div>' +
          '<div class="feature-grid">' +
            "<div>" +
              '<div class="row" style="flex-wrap:wrap">' +
                '<span class="live"><span class="dot"></span>Gerade aktuell</span>' +
                (cur.type === "vip" ? '<span class="pill gold">VIP</span>' : "") +
              "</div>" +
              '<h2 class="feature-title">' + esc(cur.name) + "</h2>" +
              '<p class="meta">' + cur.year + " · Folge " + cur.ep + " von " + cur.totalEp + "</p>" +
              '<span class="btn btn-primary" style="margin-top:24px">Staffel ansehen <span class="arw">→</span></span>' +
            "</div>" +
            '<dl class="ledger">' +
              '<div><dd data-count="' + cur.sol + '" style="color:var(--accent-hi)">0</dd><dt>' + (cur.sol === 1 ? "Möglichkeit" : "Möglichkeiten") + "</dt></div>" +
              '<div><dd data-count="' + cur.conf + '" style="color:var(--gold)">0</dd><dt>Fix-Matches</dt></div>' +
              '<div><dd data-count="' + parts + '">0</dd><dt>Personen</dt></div>' +
            "</dl>" +
          "</div>" +
        "</a>" +
      "</section>" +
      '<section class="wrap" data-od-id="archive">' +
        '<div class="sec-head"><h2>Alle Staffeln</h2><span class="meta">' + archive.length + " im Archiv</span></div>" +
        '<div class="cards">' + archive.map(seasonCard).join("") + "</div>" +
      "</section>";
    bindCounters();
  }

  /* ── season ───────────────────────────────────────────────────────── */
  function gaugeHTML(s, d, clarity, LEN) {
    return '<section class="card gauge-card" data-od-id="clarity">' +
      '<div class="gauge-wrap">' +
        '<svg viewBox="0 0 200 118" class="gauge" aria-hidden="true">' +
          "<defs><linearGradient id=\"gg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">" +
            '<stop offset="0" stop-color="var(--heat-1)"/><stop offset="55%" stop-color="var(--heat-3)"/><stop offset="100%" stop-color="var(--heat-4)"/>' +
          "</linearGradient></defs>" +
          '<path d="M 14 100 A 86 86 0 0 1 186 100" fill="none" stroke="var(--border)" stroke-width="12" stroke-linecap="round"/>' +
          '<path id="gaugeArc" d="M 14 100 A 86 86 0 0 1 186 100" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + LEN.toFixed(2) + '" stroke-dashoffset="' + LEN.toFixed(2) + '"/>' +
        "</svg>" +
        '<div class="gauge-val"><b><span data-count="' + clarity + '">0</span><i>%</i></b><span class="kicker">Klarheit</span></div>' +
      "</div>" +
      "<div>" +
        '<p class="kicker">Der aktuelle Stand</p>' +
        '<p class="clarity-line">' + (d.solved
          ? 'Gelöst. Es gibt nur noch eine <em>Kombination</em>.'
          : 'Noch <em>' + fmt(s.sol) + "</em> mögliche Kombinationen.") + "</p>" +
        '<div class="mini-stats">' +
          '<div class="mini"><b style="color:var(--accent-hi)">' + fmt(s.sol) + '</b><span>' + (s.sol === 1 ? "Möglichkeit" : "Möglichkeiten") + "</span></div>" +
          '<div class="mini"><b style="color:var(--gold)">' + d.confirmed.length + ' <i>/ ' + d.males.length + '</i></b><span>Fixe Matches</span></div>' +
        "</div>" +
      "</div>" +
    "</section>";
  }

  function confirmedHTML(d) {
    if (!d.confirmed.length) return "";
    var items = d.confirmed.map(function (c) {
      return '<div class="cmatch">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 10V7a5 5 0 0 1 10 0v3"/><rect x="4" y="10" width="16" height="10" rx="1.5"/></svg>' +
        who(d.males[c[0]], d.females[c[1]]) + "</div>";
    }).join("");
    return '<section data-od-id="confirmed"><div class="sec-head"><h2>Fixe Perfect Matches</h2><span class="meta" style="color:var(--gold)">stehen fest</span></div><div class="confirmed">' + items + "</div></section>";
  }

  function topHTML(d) {
    if (!d.top.length) return "";
    var cards = d.top.map(function (t) {
      var p = t[2], col = heat(p), tr = tier(p);
      var badge = p >= 1 ? '<span class="pill gold">Fix</span>' : t[3] ? '<span class="pill violet">Doppel</span>' : "";
      return '<div class="mcard" data-od-id="match-card" style="border-left-color:' + col + '">' +
        '<div class="between" style="align-items:flex-start">' + who(d.males[t[0]], d.females[t[1]]) + badge + "</div>" +
        '<div class="tier"><span style="color:' + col + '">' + tr.label + '</span><b style="color:' + col + '">' + fmtP(p) + "</b></div>" +
        '<div class="mbar"><i data-bar="' + (p * 100).toFixed(1) + '" style="width:0%;background:linear-gradient(90deg,var(--heat-1),' + col + ')"></i></div>' +
      "</div>";
    }).join("");
    return '<section data-od-id="top-pairings"><div class="sec-head"><h2>Die heißesten Paarungen</h2><span class="meta">aktuell je Person</span></div><div class="matches">' + cards + "</div></section>";
  }

  function matrixHTML(s, d) {
    var nf = d.females.length;
    var conf = {}; d.confirmed.forEach(function (c) { conf[c[0] + "-" + c[1]] = 1; });
    var off = {}; d.ruledOut.forEach(function (c) { off[c[0] + "-" + c[1]] = 1; });
    var head = '<th class="corner" scope="col"></th>';
    d.females.forEach(function (f) { head += '<th class="colhead" scope="col"><span>' + esc(f) + "</span></th>"; });
    var body = d.males.map(function (m, r) {
      var cells = d.females.map(function (f, c) {
        var p = d.probs[r * nf + c];
        var key = r + "-" + c;
        var cls = "cell" + (conf[key] ? " is-conf" : "");
        var label = esc(m) + " & " + esc(f) + ": " + fmtP(p);
        return '<td><button type="button" class="' + cls + '" data-m="' + r + '" data-f="' + c + '" aria-label="' + label + '" style="background:' + heat(p) + ";color:" + heatText(p) + '">' + (p > 0 ? "<span>" + fmtP(p) + "</span>" : "") + "</button></td>";
      }).join("");
      return '<tr><th class="rowhead" scope="row"><span>' + esc(m) + "</span></th>" + cells + "</tr>";
    }).join("");
    return '<section data-od-id="matrix">' +
      '<div class="sec-head"><h2>Alle Paarungen</h2><span class="meta">je kräftiger, desto wahrscheinlicher</span></div>' +
      '<div class="card matrix">' +
        '<div class="matrix-readout" id="matrixReadout"><p class="hint">Tippe oder fahre über ein Feld · Männer links, Frauen oben · nach rechts wischen</p></div>' +
        '<div class="matrix-scroll"><table class="mgrid" role="grid" aria-label="Match-Chancen Matrix"><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>" +
        '<div class="legend"><span>0%</span><span class="ramp" aria-hidden="true"></span><span>100%</span></div>' +
      "</div>" +
    "</section>";
  }

  function doubleHTML(d) {
    var dm = d.double;
    if (!dm.applicable || !dm.cands.length) return "";
    var max = Math.max.apply(null, dm.cands.map(function (c) { return c[1]; }).concat([0.0001]));
    var rows = dm.cands.map(function (c, i) {
      return '<div class="drow">' +
        '<span class="rank">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<span class="nm" style="color:' + (c[2] === "male" ? "var(--him)" : "var(--her)") + '">' + esc(c[0]) + "</span>" +
        '<span class="track"><i data-bar="' + ((c[1] / max) * 100).toFixed(1) + '" style="width:0%"></i></span>' +
        '<span class="pc">' + fmtP(c[1]) + "</span>" +
      "</div>";
    }).join("");
    return '<section data-od-id="double-match"><div class="sec-head"><h2>Wer hat das Doppel?</h2><span class="meta">zwei Perfect Matches</span></div>' +
      '<div class="card double"><p class="lead-sm">Eine Person kann in dieser Staffel zwei Perfect Matches haben. Wer ist am wahrscheinlichsten dabei?</p>' + rows + "</div></section>";
  }

  function nightsHTML(d) {
    if (!d.nights.length) return "";
    var maxM = Math.max.apply(null, d.nights.map(function (n) { return n.matches; }).concat([1]));
    var items = d.nights.map(function (n, i) {
      var pips = ""; for (var k = 0; k < maxM; k++) pips += '<i class="' + (k < n.matches ? "on" : "") + '"></i>';
      var pairs = n.pairs.map(function (p) { return '<div class="npair">' + who(d.males[p[0]], d.females[p[1]]) + "</div>"; }).join("");
      var notes = (n.loners.length ? '<p class="note">Ohne Match: ' + esc(n.loners.join(", ")) + "</p>" : "") + (n.blackout ? '<p class="note danger">Blackout</p>' : "");
      return '<details class="night"' + (i === d.nights.length - 1 ? " open" : "") + ">" +
        '<summary><span class="row"><span class="num">' + String(n.n).padStart(2, "0") + '</span><span class="nlabel">Nacht ' + n.n + "</span></span>" +
        '<span class="mcount"><span class="pips">' + pips + "</span><b>" + n.matches + '</b><small>' + (n.matches === 1 ? "Licht" : "Lichter") + "</small></span></summary>" +
        '<div class="night-body">' + notes + '<div class="night-pairs">' + pairs + "</div></div></details>";
    }).join("");
    return '<section data-od-id="matching-nights"><div class="sec-head"><h2>Matching Nights</h2><span class="meta">was bisher feststand</span></div><div class="nights">' + items + "</div></section>";
  }

  function renderSeason(id) {
    var s = D.seasons.filter(function (x) { return x.id === id; })[0] || D.seasons.filter(function (x) { return x.current; })[0];
    var d = D.detail[s.id];
    document.title = s.name + " — AYTO Matches";
    try { localStorage.setItem("ayto:lastSeason", s.id); } catch (e) {}
    if (d.infeasible) {
      root.innerHTML = '<div class="wrap season-view"><div>' +
        '<a class="back" href="#/"><span class="arw">←</span> Zur Übersicht</a>' +
        '<header class="masthead"><h1>' + esc(s.name) + "</h1></header></div>" +
        '<section class="card" data-od-id="infeasible" style="padding:32px;border-color:color-mix(in oklab,var(--danger) 45%,var(--border))">' +
          '<p class="kicker" style="color:var(--danger)">Passt nicht zusammen</p>' +
          '<h2 style="margin-top:12px">Keine passende Kombination</h2>' +
          '<p class="lead-sm" style="margin-top:12px">Die bekannten Matching Nights und Matchboxen widersprechen sich. Wahrscheinlich fehlt noch eine Info oder eine Zahl ist falsch.</p>' +
        "</section></div>";
      return;
    }
    var clarity = d.solved ? 100 : Math.max(3, Math.round(100 / Math.sqrt(s.sol)));
    var LEN = Math.PI * 86;
    root.innerHTML = '<div class="wrap season-view">' +
      "<div>" +
        '<a class="back" href="#/"><span class="arw">←</span> Zur Übersicht</a>' +
        '<header class="masthead" data-od-id="season-masthead">' +
          '<div class="mrow"><span class="kicker">' + s.year + " · Folge " + s.ep + " von " + s.totalEp + "</span>" + (s.type === "vip" ? '<span class="pill gold">VIP</span>' : "") + "</div>" +
          "<h1>" + esc(s.name) + "</h1>" +
          '<p class="sub">' + d.males.length + " Männer · " + d.females.length + " Frauen" + (d.males.length !== d.females.length ? " · ungleich verteilt" : "") + "</p>" +
        "</header>" +
      "</div>" +
      gaugeHTML(s, d, clarity, LEN) + confirmedHTML(d) + topHTML(d) + matrixHTML(s, d) + doubleHTML(d) + nightsHTML(d) +
    "</div>";
    bindGauge(LEN, clarity);
    bindCounters();
    bindMatrix(d);
  }

  /* ── bindings ─────────────────────────────────────────────────────── */
  function countUp(el) {
    var target = +el.dataset.count || 0;
    if (reduce || target <= 0) { el.textContent = fmt(target); return; }
    var dur = 1100, start = performance.now();
    var tick = function (now) {
      var t = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - t, 3);
      el.textContent = fmt(target * e);
      if (t < 1) requestAnimationFrame(tick); else el.textContent = fmt(target);
    };
    requestAnimationFrame(tick);
  }
  function bindCounters() {
    var els = root.querySelectorAll("[data-count]");
    if (reduce) { els.forEach(function (el) { el.textContent = fmt(+el.dataset.count || 0); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { countUp(en.target); io.unobserve(en.target); } });
    }, { threshold: 0.4 });
    els.forEach(function (el) { io.observe(el); });
  }
  function bindBars() {
    var bars = root.querySelectorAll("[data-bar]");
    var apply = function () { bars.forEach(function (b) { b.style.width = b.dataset.bar + "%"; }); };
    if (reduce) apply(); else requestAnimationFrame(function () { requestAnimationFrame(apply); });
  }
  function bindGauge(LEN, clarity) {
    var arc = root.querySelector("#gaugeArc");
    if (!arc) return;
    var offset = LEN * (1 - clarity / 100);
    if (reduce) arc.style.strokeDashoffset = offset; else requestAnimationFrame(function () { arc.style.strokeDashoffset = offset; });
  }
  function bindMatrix(d) {
    var table = root.querySelector("table.mgrid");
    var readout = root.querySelector("#matrixReadout");
    if (!table || !readout) return;
    var nf = d.females.length;
    var cells = Array.prototype.slice.call(table.querySelectorAll(".cell"));
    var hint = readout.innerHTML;
    function setActive(r, c) {
      var p = d.probs[r * nf + c], tr = tier(p);
      readout.innerHTML = '<div class="ro-names"><span class="him">' + esc(d.males[r]) + '</span><i>&amp;</i><span class="her">' + esc(d.females[c]) + '</span></div>' +
        '<div class="ro-val"><b style="color:' + heat(p) + '">' + fmtP(p) + "</b><span" + (p >= 1 ? ' style="color:var(--gold)"' : "") + ">" + tr.label + "</span></div>";
      table.querySelectorAll(".colhead").forEach(function (th, ci) { th.classList.toggle("is-active", ci === c); });
      table.querySelectorAll(".rowhead").forEach(function (th, ri) { th.classList.toggle("is-active", ri === r); });
      cells.forEach(function (cell) {
        var cr = +cell.dataset.m, cf = +cell.dataset.f;
        cell.classList.toggle("active", cr === r && cf === c);
        cell.classList.toggle("dim", cr !== r && cf !== c);
      });
    }
    function clear() {
      readout.innerHTML = hint;
      table.querySelectorAll(".colhead,.rowhead").forEach(function (el) { el.classList.remove("is-active"); });
      cells.forEach(function (cell) { cell.classList.remove("active", "dim"); });
    }
    table.addEventListener("mouseover", function (e) { var c = e.target.closest(".cell"); if (c) setActive(+c.dataset.m, +c.dataset.f); });
    table.addEventListener("mouseleave", clear);
    table.addEventListener("focusin", function (e) { var c = e.target.closest(".cell"); if (c) setActive(+c.dataset.m, +c.dataset.f); });
    table.addEventListener("focusout", function () { if (!table.contains(document.activeElement)) clear(); });
    table.addEventListener("click", function (e) { var c = e.target.closest(".cell"); if (c) setActive(+c.dataset.m, +c.dataset.f); });
  }

  /* ── nav + router ─────────────────────────────────────────────────── */
  function buildSelect() {
    var sel = document.getElementById("seasonSelect");
    sel.innerHTML = D.seasons.map(function (s) {
      return '<option value="' + s.id + '">' + esc(s.name) + (s.current ? " · aktuell" : "") + "</option>";
    }).join("");
    sel.addEventListener("change", function () { location.hash = "#/staffel/" + sel.value; });
  }
  function syncSelect() {
    var sel = document.getElementById("seasonSelect");
    var m = location.hash.match(/#\/staffel\/([^/]+)/);
    var id = m ? m[1] : null;
    if (!id) { try { id = localStorage.getItem("ayto:lastSeason"); } catch (e) {} }
    if (!id || !D.detail[id]) id = (D.seasons.filter(function (s) { return s.current; })[0] || D.seasons[0]).id;
    sel.value = id;
  }
  function route() {
    var m = location.hash.match(/#\/staffel\/([^/]+)/);
    if (m && D.detail[m[1]]) renderSeason(m[1]); else renderOverview();
    bindBars();
    try { window.scrollTo({ top: 0, behavior: "auto" }); } catch (e) {}
    syncSelect();
  }
  buildSelect();
  window.addEventListener("hashchange", function () {
    var h = location.hash;
    if (h && h !== "#/" && !h.indexOf("#/") === 0) return;
    if (h && h !== "#/" && h.indexOf("#/") !== 0) return;
    route();
  });
  route();
})();
</script>
</body>
</html>
