---
name: Test and build

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: pi-unprivileged-ci
    timeout-minutes: 30
    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Bootstrap pinned uv in an isolated venv
        run: |
          set -euo pipefail
          python3 -m venv .ci-uv
          .ci-uv/bin/python -m pip install --only-binary=:all: 'uv==0.12.15'

      - name: Install managed Python 3.13
        run: .ci-uv/bin/uv python install 3.13

      - name: Static check graph build path
        run: >-
          .ci-uv/bin/uv run --python 3.13 --no-project
          --with 'flake8==7.3.0'
          flake8 --select=F821,F822,F823 --config=.flake8
          ayto_solver/solvers/graph_solver.py build.py

      - name: Run ARM-compatible graph solver tests
        run: >-
          .ci-uv/bin/uv run --python 3.13 --no-project
          --with 'pytest==9.1.1'
          --with 'PyYAML==6.0.3'
          --with 'networkx==3.6.1'
          --with 'numpy==2.5.3'
          pytest -q tests/test_examples_graph.py tests/test_graph_degree_profiles.py tests/test_build.py

      - name: Generate static data from checked-in season inputs
        run: >-
          PYTHONHASHSEED=0
          AYTO_BUILD_RANDOM_SEED=0
          SOURCE_DATE_EPOCH=0
          .ci-uv/bin/uv run --python 3.13 --no-project
          --with 'PyYAML==6.0.3'
          --with 'networkx==3.6.1'
          --with 'numpy==2.5.3'
          python build.py

      - name: Build frontend
        working-directory: frontend
        run: npm run build
